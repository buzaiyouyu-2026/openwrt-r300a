# GitHub Actions：一键构建 Oray R300A (5151G / MT7620A) 的 OpenWrt 固件
#
# 用法：
#   1. 在 GitHub 新建任意仓库（或 fork mhycy/openwrt-r300a）；
#   2. 把本文件放到 .github/workflows/build-r300a-openwrt.yml；
#   3. 仓库 Actions 标签 → 本工作流 → Run workflow；
#   4. 跑完后在 Artifacts 下载 openwrt-r300a，取
#      bin/targets/ramips/mt7620/openwrt-ramips-mt7620-oray_r300a-squashfs-sysupgrade.bin
#
# 说明：
#   - 源码直接拉 mhycy/openwrt-r300a 分支 r300a-support-dev（OpenWrt 22.03 基线，含 oray_r300a 设备）
#   - 已加 luci / uqmi / wireguard / 4G·USB 驱动，刷完即可 Web 管理 + 4G + 隧道
#   - 若某 feed 失效，按报错改 feeds.conf.default 后重跑
#   - 免费 runner 约 1.5~3 小时，勿超 6 小时上限

name: Build OpenWrt for Oray R300A

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-r300a-openwrt.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mhycy/openwrt-r300a (r300a-support-dev)
        uses: actions/checkout@v4
        with:
          repository: mhycy/openwrt-r300a
          ref: r300a-support-dev
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget vim \
            ccache

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config (target oray_r300a + luci + qmi + wireguard)
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_oray_r300a=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-uhci=y
          CONFIG_PACKAGE_kmod-mt76x0e=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          EOF
          make defconfig

      - name: Build (ccache 加速)
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/ccache"
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r300a
          path: bin/targets/ramips/mt7620/*.bin
          if-no-files-found: error
